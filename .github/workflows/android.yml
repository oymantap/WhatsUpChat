name: WhatsUpChat Official Build
on:
  push:
    branches: [ main ] # Pastikan branch utama kamu namanya 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. Bikin file google-services.json dari GitHub Secret
      - name: Create Google Services JSON
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # 2. Decode Keystore dari Base64 Colab balik jadi file .jks
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/keystore.jks

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 3. Rakit APK Resmi (Release)
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 4. Simpan APK-nya biar bisa kamu download
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: WhatsUpChat-Official-APK
          path: app/build/outputs/apk/release/app-release.apk
          
